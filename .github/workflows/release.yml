name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: vet and test
        run: |
          go vet ./...
          go test ./...
      - name: build release binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w" -o tmuxgo .
            tar -czf "dist/tmuxgo_${GITHUB_REF_NAME}_${os}_${arch}.tar.gz" tmuxgo
          done
          cd dist && sha256sum *.tar.gz > "tmuxgo_${GITHUB_REF_NAME}_checksums.txt"
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
